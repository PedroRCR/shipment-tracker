spring.datasource.url=jdbc:postgresql://localhost:5432/shipmentTracker
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver # Spring Boot can infer this from the URL

spring.jpa.hibernate.ddl-auto=update # use none in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect